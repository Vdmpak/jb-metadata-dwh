services:
  minio:
    image: chainguard/minio:latest
    container_name: jetbrains-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: jetbrains-iceberg-rest
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: "jdbc:sqlite:/var/lib/iceberg/iceberg_catalog.db?journal_mode=WAL"
    volumes:
      - ./iceberg_catalog:/var/lib/iceberg
    depends_on:
      - minio

  trino:
    image: trinodb/trino:latest
    container_name: jetbrains-trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    depends_on:
      - minio
      - iceberg-rest

volumes:
  minio_data:
